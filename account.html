<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader Account | Dugout Detectives</title>
  <meta name="description" content="Create or access your Dugout Detectives reader account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Dugout Detectives</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="roster.html">Roster</a>
        <a href="verify.html">Verify</a>
        <a href="leaderboard.html">Scoreboard</a>
        <a href="about.html">About</a>
        <a class="nav-account" href="account.html">Sign In</a>
      </nav>
    </div>
  </header>
  <main>
    
<section class="page-hero">
  <div class="container page-hero-inner">
    <p class="eyebrow">Reader Account</p>
    <h1>Return to the Dugout</h1>
    <p>Create a username and password so you can revisit the site and post your official solve time.</p>
  </div>
</section>
<section class="section">
  <div class="container account-grid">
    <div class="panel auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" type="button" data-auth-tab="signin">Sign In</button>
        <button class="auth-tab" type="button" data-auth-tab="signup">Create Account</button>
      </div>
      <form id="signin-form" class="auth-form">
        <label>Email<input id="signin-email" type="email" required autocomplete="email"></label>
        <label>Password<input id="signin-password" type="password" required autocomplete="current-password"></label>
        <button class="button button-primary" type="submit">Sign In</button>
      </form>
      <form id="signup-form" class="auth-form" hidden>
        <label>Public username<input id="signup-username" type="text" minlength="3" maxlength="24" required></label>
        <label>Email<input id="signup-email" type="email" required autocomplete="email"></label>
        <label>Password<input id="signup-password" type="password" minlength="8" required autocomplete="new-password"></label>
        <button class="button button-primary" type="submit">Create Account</button>
      </form>
      <div id="auth-message" class="form-message" role="status"></div>
      <div id="signed-in-panel" hidden>
        <h2>You're signed in.</h2><p id="signed-in-copy"></p>
        <a class="button button-primary" href="leaderboard.html">Go to Scoreboard</a>
        <button id="signout-button" class="button button-secondary" type="button">Sign Out</button>
      </div>
    </div>
  </div>
</section>

  </main>
  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>© 2026 Dugout Detectives. All rights reserved.</p>
      <p><a href="about.html">About the Series</a></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script>
</body>
</html>
